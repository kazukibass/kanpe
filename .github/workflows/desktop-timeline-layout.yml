name: Desktop timeline layout

on:
  pull_request:
    paths:
      - index.html
      - home.html
      - tests/desktop-timeline-layout.test.mjs
      - tests/trace-memo-import.test.mjs
      - .github/workflows/desktop-timeline-layout.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/desktop-timeline-layout.test.mjs
      - run: node --test tests/trace-memo-import.test.mjs
